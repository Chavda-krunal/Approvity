name: approvity
description: "A faculty leave management application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase Dependencies for your backend logic
  firebase_core: ^3.0.0       # Required to initialize Firebase
  firebase_auth: ^5.0.0       # For HOD and Faculty login
  firebase_database: ^11.0.0  # REQUIRED: For Realtime Database (Login nodes)
  cloud_firestore: ^5.0.0     # For storing user and leave request data (Optional now)
  firebase_messaging: ^15.0.0 # For request-and-accept push notifications

dev_dependencies:
  flutter_test:
    sdk: flutter
  intl: ^0.19.0
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  # Asset configuration for your images and icons
#  assets:
#    - assets/icons/

  # Custom font configuration
  fonts:
    - family: ChelseaMarket-Regular
      fonts:
        - asset: assets/fonts/ChelseaMarket-Regular.ttf